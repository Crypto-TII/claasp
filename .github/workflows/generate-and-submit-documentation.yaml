name: Generate and submit documentation
on:
  push:
    branches:
      - main
permissions: write-all
jobs:
  generate-documentation:
    runs-on: ubuntu-latest
    # The CLAASP base image already has Sage, Sphinx and LaTeX installed,
    # so the docs can be built on a standard GitHub runner.
    container:
      image: tiicrc/claasp-base:latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Generate documentation
      run: make doc

    - name: Commit & Push changes
      uses: actions-js/push@master
      with:
        branch: 'main'
        github_token: ${{ secrets.AUTHORIZATION_TOKEN }}
        message: "Update documentation"

    - name: Update develop branch
      uses: morbalint/git-merge-action@v1
      with:
        target: 'develop'
        source: 'main'
        strategy_options: 'ours'
        token: ${{ secrets.AUTHORIZATION_TOKEN }}