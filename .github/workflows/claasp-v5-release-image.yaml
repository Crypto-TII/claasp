name: CLAASP 5 release image

on:
  push:
    branches: [claasp-v5]
    paths:
      - "docker/v5/**"
      - "next/**"
      - "required_dependencies/**"
      - ".github/workflows/claasp-v5-release-image.yaml"
  pull_request:
    branches: [claasp-v5]
    paths:
      - "docker/v5/**"
      - "next/**"
      - "required_dependencies/**"
      - ".github/workflows/claasp-v5-release-image.yaml"

permissions:
  contents: read

jobs:
  multiarch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/v5/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=claasp-v5-release
          cache-to: type=gha,scope=claasp-v5-release,mode=max

  architecture-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build local architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/v5/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: claasp-v5-release:ci
          cache-from: type=gha,scope=claasp-v5-release
      - name: Run complete release matrix
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/workspace/next/src \
            -v "$GITHUB_WORKSPACE:/workspace" \
            claasp-v5-release:ci /workspace/docker/v5/check.sh
