name: CLAASP next core

on:
  push:
    branches:
      - claasp-v5
  pull_request:
    branches:
      - claasp-v5
    paths:
      - "next/**"
      - "docs/architecture/**"
      - ".github/workflows/claasp-next.yaml"

concurrency:
  group: claasp-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sage-free-tests:
    name: Sage-free Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: next

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install isolated development package
        run: python -m pip install -e '.[dev,docs]'

      - name: Verify Sage is not installed
        run: python -c "import importlib.util; assert importlib.util.find_spec('sage') is None"

      - name: Run next-generation tests
        run: python -m pytest

      - name: Run Python API doctests
        run: python -m pytest --doctest-modules src/claasp_next

      - name: Run documentation doctests
        run: python -m sphinx -W --keep-going -b doctest docs docs/_build/doctest

      - name: Build HTML documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  singular-export:
    name: Singular exporter integration
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: next

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Singular
        run: |
          sudo apt-get update
          sudo apt-get install --yes singular

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Execute Singular exporter integration
        run: python -m pytest tests/unit/test_singular_exporter.py -q

  msolve-export:
    name: msolve exporter integration
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: next

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install msolve
        run: |
          sudo apt-get update
          sudo apt-get install --yes msolve

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Execute msolve exporter integration
        run: python -m pytest tests/unit/test_msolve_exporter.py -q

  minisat-execution:
    name: MiniSat execution integration
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: next

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MiniSat
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisat

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Execute MiniSat integration
        run: python -m pytest -m external tests/integration/test_minisat_integration.py -q
