name: Run doctest

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - develop
      - main

concurrency:
  group: run-doctest_${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-doctest_x86_64:
    runs-on: self-hosted
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Fix Directory Structure
      uses: ./.github/actions/fix-directory

    - name: Run test
      run: |
            cd /home/runner/_work/claasp
            make test
      env:
        GUROBI_COMPUTE_SERVER: ${{ secrets.GUROBI_COMPUTE_SERVER }}

  run-doctest-arm64:
    if: ${{ !github.event.repository.fork }}
    runs-on: arm64
    container:
      image: tiicrc/claasp-lib:develop-arm64
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Run doctest
      run: |
        uname -a
        make test
      env:
        GUROBI_COMPUTE_SERVER: ${{ secrets.GUROBI_COMPUTE_SERVER }}
