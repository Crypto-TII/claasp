name: Run doctest

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - develop
      - main

concurrency:
  group: run-doctest_${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-doctest:
    runs-on: self-hosted
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Fix Directory Structure
      run: |
        mkdir /home/runner/_work/claasp_backup
        mv -f /home/runner/_work/claasp/claasp/* /home/runner/_work/claasp_backup
        rm -rf /home/runner/_work/claasp/
        mkdir /home/runner/_work/claasp
        mv -f /home/runner/_work/claasp_backup/* /home/runner/_work/claasp
        chmod g+w /home/runner/_work/claasp/ -R
        rm -rf /home/runner/_work/claasp_backup

    - name: Build doctest image
      run: |
        cd /home/runner/_work/claasp
        rm -rf build claasp.egg-info
        docker build -f docker/Dockerfile --target claasp-base -t claasp:doctest .

    - name: Run test in Docker
      run: |
        docker run --rm \
          -e PYTHONPATH=/home/sage/tii-claasp \
          --mount type=bind,source=/home/runner/_work/claasp,target=/home/sage/tii-claasp \
          -w /home/sage/tii-claasp \
          claasp:doctest \
          sh -lc 'make install && make test'
      env:
        GUROBI_COMPUTE_SERVER: ${{ secrets.GUROBI_COMPUTE_SERVER }}
