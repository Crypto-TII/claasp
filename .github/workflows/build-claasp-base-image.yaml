name: Build and push Intel and M1 images for testing
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-image:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Compute image tag
      id: tag
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "tag=latest" >> "$GITHUB_OUTPUT"
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          echo "tag=develop" >> "$GITHUB_OUTPUT"
        else
          SHA="${{ github.event.pull_request.head.sha }}"
          echo "tag=${SHA:0:7}" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_REGISTRY_USER }}
        password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

    - name: Build & Push
      uses: docker/build-push-action@v4
      id: built-image
      with:
        context: .
        file: ./docker/Dockerfile
        push: true
        platforms: linux/amd64
        tags: tiicrc/claasp-base:${{ steps.tag.outputs.tag }}
        target: claasp-base
        cache-from: type=gha,scope=claasp-base
        cache-to: type=gha,scope=claasp-base,mode=max