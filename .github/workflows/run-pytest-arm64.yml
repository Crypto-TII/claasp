---
name: Run pytest on arm64

on:
  push:
    branches:
      - devops/arm64-linux-support

concurrency:
  group: run-pytest-tests_${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-doctest-arm64:
    if: ${{ !github.event.repository.fork }}
    runs-on: arm64
    # Run the job steps inside your specified Docker image
    container:
      image: tiicrc/claasp-lib:develop-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4  # Upgraded to v4 for better support/performance
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run doctest
        run: |
          uname -a
          make test
        env:
          GUROBI_COMPUTE_SERVER: ${{ secrets.GUROBI_COMPUTE_SERVER }}
