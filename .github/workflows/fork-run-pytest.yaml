name: Run tests for Forked projects

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - develop
      - main

concurrency:
  group: fork-run-pytest-tests_${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-doctest:
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Run doctest
      # Reduced parallelism (-tp 4) to fit within the 7 GB / 2 vCPU GitHub-hosted limit.
      run: docker run --rm -v $PWD:/home/sage/tii-claasp tiicrc/claasp-base:latest bash -lc "cd /home/sage/tii-claasp && make install && SAGE_TIMEOUT=600 sage -tp 4 claasp"

  run-pytest:
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Run tests
      run: docker run --rm -v $PWD:/home/sage/tii-claasp tiicrc/claasp-base:latest make github-pytest
