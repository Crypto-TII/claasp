name: Run pytest and SonarCloud Scan

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - develop
      - main

concurrency:
  group: run-pytest-tests_${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-pytest-x86_64:
    if: ${{ !github.event.repository.fork }}
    runs-on: self-hosted
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Fix Directory Structure
      uses: ./.github/actions/fix-directory

    - name: Run remote-pytest
      run: |
            cd /home/runner/_work/claasp
            make remote-pytest
      env:
        GUROBI_COMPUTE_SERVER: ${{ secrets.GUROBI_COMPUTE_SERVER }}

    - name: Upload Coverage.xml to artifacts
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: /home/runner/_work/claasp/coverage.xml
        overwrite: true

  run-pytest-arm64:
    if: ${{ !github.event.repository.fork }}
    runs-on: arm64
    container:
      image: tiicrc/claasp-lib:develop-arm64
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Run pytest
      run: |
        uname -a
        make install
        make remote-pytest
      env:
        GUROBI_COMPUTE_SERVER: ${{ secrets.GUROBI_COMPUTE_SERVER }}

  run-code-coverage:
    # Pull requests from forks don't receive SONAR_TOKEN, so the scan would fail.
    if: ${{ github.event_name == 'push' || !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Download Latest Coverage.xml from Artifacts
      uses: actions/download-artifact@v8
      with:
        name: coverage-report

    - name: Override Coverage Source Path for Sonar
      run: sed -i "s/<source>\/home\/runner\/_work\/claasp<\/source>/<source>\/github\/workspace\/claasp<\/source>/g" coverage.xml

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@master
      with:
        args: >
          -Dsonar.branch.name=${{ env.GITHUB_HEAD_REF }}
          -Dsonar.python.coverage.reportPaths=coverage.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    needs: run-pytest-x86_64
