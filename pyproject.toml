[build-system]
requires = ["setuptools==78.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "claasp"
version = "5.0.0rc1"
description = "Sage-independent typed framework for cryptographic primitives and analysis"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{name = "TII Cryptanalysis Team"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "build==1.3.0"]
docs = ["sphinx==9.0.4", "furo==2025.12.19"]
quality = ["ruff==0.16.8", "mypy==2.3.1"]
ml = ["numpy>=1.24", "scikit-learn>=1.3"]
ml-tensorflow = ["numpy>=1.24", "tensorflow>=2.13"]
presentation = ["matplotlib>=3.7", "pandas>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra --import-mode=importlib -m "not external and not extended"'
markers = [
  "external: requires an executable supplied by a dedicated integration job",
  "extended: exhaustive dependency-free audit kept outside the routine time budget",
  "performance: asserts a native wall-clock budget and is not valid under emulation",
  "emulation_sensitive: invokes an external tool with a native-runtime timeout that is not valid under emulation",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "build",
  "dist",
  "docs/_build",
  "*.egg-info",
]

[tool.ruff.lint]
select = [
  "A001",
  "A002",
  "B002",
  "B003",
  "B004",
  "B005",
  "B006",
  "B007",
  "B009",
  "B010",
  "B012",
  "B013",
  "B014",
  "B015",
  "B016",
  "B017",
  "B018",
  "B020",
  "B022",
  "B023",
  "B025",
  "B029",
  "B030",
  "B031",
  "B032",
  "B033",
  "B039",
  "E4",
  "E701",
  "E702",
  "E703",
  "E711",
  "E712",
  "E713",
  "E714",
  "E721",
  "E722",
  "E9",
  "F",
  "I",
  "RUF009",
  "RUF012",
  "RUF013",
  "RUF100",
  "UP006",
  "UP007",
  "UP035",
]

[tool.ruff.format]
docstring-code-format = false

[tool.ruff.lint.per-file-ignores]
# The inventory must add its sibling tool directory before importing the classifier.
"tools/legacy_inventory.py" = ["E402"]
# Matplotlib's backend must be selected before importing pyplot and renderers.
"tests/unit/drivers/renderers/test_presentation.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src/claasp", "tests", "tools", "docs/conf.py"]
mypy_path = ["src", "tools"]
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
pretty = false
no_error_summary = true

[[tool.mypy.overrides]]
# Optional presentation/ML packages are absent from the dependency-free
# quality environment. Treat their imported APIs as
# external boundaries whether or not a contributor happens to have them
# installed, so the exact baseline is reproducible.
module = [
  "matplotlib",
  "matplotlib.*",
  "numpy",
  "numpy.*",
  "pandas",
  "pandas.*",
  "sklearn",
  "sklearn.*",
  "tensorflow",
  "tensorflow.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["data/*.json", "data/*.dat", "data/*.md"]
