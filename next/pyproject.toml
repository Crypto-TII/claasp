[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claasp-next"
version = "0.1.0.dev0"
description = "Sage-independent typed core for the next major CLAASP release"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "TII Cryptanalysis Team"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["sphinx>=6", "furo>=2024.1.29"]
ml = ["numpy>=1.24", "scikit-learn>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra -m "not external"'
markers = ["external: requires an executable supplied by a dedicated integration job"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"claasp_next.parameters.data" = ["*.json", "*.md"]
"claasp_next.primitives.block_ciphers.data" = ["*.json", "*.json.gz"]
"claasp_next.primitives.tweakable_block_ciphers.data" = ["*.json", "*.json.gz"]
