[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claasp-next"
version = "0.1.0.dev0"
description = "Sage-independent typed core for the next major CLAASP release"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "TII Cryptanalysis Team"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["sphinx>=6", "furo>=2024.1.29"]
ml = ["numpy>=1.24", "scikit-learn>=1.3"]
presentation = ["matplotlib>=3.7", "pandas>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra -m "not external and not extended"'
markers = [
  "external: requires an executable supplied by a dedicated integration job",
  "extended: exhaustive dependency-free audit kept outside the routine time budget",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["data/*.json", "data/*.dat", "data/*.md"]
